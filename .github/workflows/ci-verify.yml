# The full family gate, run on this fork branch so the reviewer can see the outcome without
# waiting for maintainer-approved actions on the upstream PR: fmt, clippy, tests, assets,
# brands, layers, wasm — exactly `cargo xtask ci`. This branch is the PR tree
# (feat/arabic-i18n) plus this one workflow file, nothing else.
name: xtask-ci-verification
on:
  push:
    branches: [ci-verification]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Debug and test builds keep line tables but drop the rest of the debug info: faster
  # codegen and links, and a smaller target dir (same as the family CI).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: cargo xtask ci (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: The full family gate (fmt, clippy, test, assets, brands, layers, wasm)
        run: cargo run --locked -q -p xtask -- ci
